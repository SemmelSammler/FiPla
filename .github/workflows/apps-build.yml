# Baut die Desktop-Apps von Obol: Windows (Installer .exe) und Mac (.dmg, läuft auf Intel und Apple-Chip).
# Start: GitHub → Actions → "Apps bauen" → "Run workflow" (läuft nur auf Knopfdruck, spart Freiminuten).
# Ergebnis: unten im Lauf als Artefakte "Obol-Windows" und "Obol-Mac" herunterladen.
name: Apps bauen

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node test/logic.test.js
      - name: App bauen
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Obol-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: App bauen
        run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Obol-Mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
